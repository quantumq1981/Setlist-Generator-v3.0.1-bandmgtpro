<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BandLeaderHQ</title>
  <!-- GitHub Pages serves this for any unknown path. The app is a single page,
       so send visitors to the site root. On a custom domain "/" is the app;
       on the interim project URL it lands on the Pages root. -->
  <meta http-equiv="refresh" content="0; url=/" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;
      font-family:system-ui,-apple-system,Arial,sans-serif;color:#e8ecf3;
      background:#0b0b0f;background-image:
        radial-gradient(800px 500px at 15% -10%,rgba(255,107,53,.12),transparent 60%),
        radial-gradient(800px 600px at 100% 0%,rgba(56,120,220,.16),transparent 55%);}
    a{color:#ff6b35;font-weight:600;text-decoration:none}
    .box{text-align:center;padding:2rem}
    h1{font-size:1.4rem;margin:0 0 .5rem}
    p{color:#9aa0a6;margin:0}
  </style>
</head>
<body>
  <div class="box">
    <h1>BandLeaderHQ</h1>
    <p>Page not found — taking you <a href="/">back to the app</a>…</p>
  </div>
</body>
</html>
